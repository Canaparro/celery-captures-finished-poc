# Postgres is NOT here on purpose: it is started per dev session by
# ops/postgres/dev_db.py (testcontainers, random host port). This file only
# provides the two long-lived brokers, on non-default ports:
#   RabbitMQ localhost:5682, Redis localhost:6389

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5682:5672"
      - "15682:15672"

  redis:
    image: redis:7
    ports:
      - "6389:6379"
