# NOTE: If you already have RabbitMQ/Redis/Postgres running (e.g. from your
# integration_tests stack), skip this file — the app connects to:
#   RabbitMQ localhost:5682, Redis localhost:6389, Postgres localhost:5442
# regardless of how those services are started.
#
# If Postgres is running with a different database/user than `celery_viewer`/
# `celery`, create them and apply ops/postgres/init.sql manually:
#   createdb -h localhost -p 5442 -U <admin> celery_viewer
#   psql -h localhost -p 5442 -U celery -d celery_viewer -f ops/postgres/init.sql

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5682:5672"
      - "15682:15672"

  redis:
    image: redis:7
    ports:
      - "6389:6379"

  postgres:
    image: postgres:16
    ports:
      - "5442:5432"
    environment:
      POSTGRES_USER: celery
      POSTGRES_PASSWORD: celery
      POSTGRES_DB: celery_viewer
    volumes:
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
